<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc"><title id="title">Decision options and outcomes</title><desc id="desc">Option A has a 60 percent chance of gaining 200 thousand dollars and a 40 percent chance of losing 50 thousand dollars. Option B provides a certain gain of 80 thousand dollars.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.branch{stroke:#172033;stroke-width:3;fill:none}.decision{fill:#315b88}.chance{fill:#f2b134;stroke:#172033;stroke-width:2}.result{fill:#fff;stroke:#172033;stroke-width:2}</style><rect width="820" height="430" fill="#fff"/><text x="410" y="30" text-anchor="middle" font-size="21" font-weight="700">Decision tree and expected value</text><path class="branch" d="M105 215L260 110M105 215L260 325M280 110L470 70M280 110L470 155M280 325H470"/><rect class="decision" x="80" y="190" width="50" height="50"/><text x="105" y="270" text-anchor="middle">Decision</text><circle class="chance" cx="270" cy="110" r="23"/><text x="270" y="80" text-anchor="middle" font-weight="700">Option A</text><rect class="result" x="470" y="43" width="250" height="55" rx="8"/><text x="595" y="67" text-anchor="middle">60%: +$200k</text><rect class="result" x="470" y="128" width="250" height="55" rx="8"/><text x="595" y="152" text-anchor="middle">40%: −$50k</text><rect class="result" x="470" y="298" width="250" height="55" rx="8"/><text x="595" y="322" text-anchor="middle">Option B: certain +$80k</text><text x="360" y="225" text-anchor="middle" font-size="16" font-weight="700">Compare expected values</text><text x="270" y="365" text-anchor="middle" font-weight="700">Option B</text><text x="410" y="402" text-anchor="middle" font-size="14">All monetary values are US dollars.</text></svg>
