<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Layered project budget</title><desc id="desc">Work estimates are 900 thousand dollars. Contingency reserve is 60 thousand and is inside the cost baseline. Management reserve is 90 thousand and is outside the cost baseline.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.work{fill:#315b88}.cont{fill:#f2b134;stroke:#172033;stroke-width:2}.manage{fill:#fff;stroke:#172033;stroke-width:3;stroke-dasharray:8 5}</style><rect width="760" height="400" fill="#fff"/><text x="380" y="30" text-anchor="middle" font-size="21" font-weight="700">Project budget composition</text><g transform="translate(105 75)"><rect class="work" width="471" height="90"/><text x="235" y="40" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">Work estimates</text><text x="235" y="68" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22">$900k</text><rect class="cont" x="471" width="31" height="90"/><text x="486" y="118" text-anchor="middle" font-size="13">Contingency $60k</text><path d="M0 140V125M0 133H502M502 140V125" stroke="#172033" stroke-width="2"/><text x="251" y="160" text-anchor="middle" font-weight="700">Cost baseline</text><rect class="manage" x="502" width="47" height="90"/><text x="525" y="145" text-anchor="middle" font-size="13">Management</text><text x="525" y="162" text-anchor="middle" font-size="13">reserve $90k</text><path d="M0 205V190M0 198H549M549 205V190" stroke="#172033" stroke-width="2"/><text x="274" y="228" text-anchor="middle" font-size="20" font-weight="700">Total project budget</text></g><text x="380" y="360" text-anchor="middle" font-size="14">Solid segment is inside the baseline; dashed segment is outside the baseline.</text></svg>
