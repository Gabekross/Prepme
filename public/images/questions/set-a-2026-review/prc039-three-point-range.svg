<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Three-point duration estimate and fixed inspection date</title><desc id="desc">Optimistic duration is 6 days, most likely duration is 10 days, and pessimistic duration is 20 days. The dependent supplier inspection is fixed on day 10.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.line{stroke:#172033;stroke-width:4}.fixed{stroke:#9c2f2f;stroke-width:4;stroke-dasharray:7 5}.mark{fill:#315b88;stroke:#fff;stroke-width:2}</style><rect width="760" height="340" fill="#fff"/><text x="380" y="30" text-anchor="middle" font-size="21" font-weight="700">Three-point duration estimate</text><path class="line" d="M90 190H690"/><g text-anchor="middle"><circle class="mark" cx="90" cy="190" r="10"/><text x="90" y="158" font-weight="700">Optimistic</text><text x="90" y="220">6 days</text><circle class="mark" cx="304" cy="190" r="10"/><text x="304" y="158" font-weight="700">Most likely</text><text x="304" y="220">10 days</text><circle class="mark" cx="690" cy="190" r="10"/><text x="690" y="158" font-weight="700">Pessimistic</text><text x="690" y="220">20 days</text></g><path class="fixed" d="M304 70V245"/><text x="304" y="60" text-anchor="middle" fill="#9c2f2f" font-family="Arial" font-weight="700">Supplier inspection: fixed day 10</text><text x="380" y="315" text-anchor="middle" font-size="14">Use the weighted three-point estimate: (O + 4M + P) ÷ 6</text></svg>
