<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">Threat probability and impact</title><desc id="desc">Three independent threats are shown. Threat 1 has 20 percent probability and 50 thousand dollar loss impact. Threat 2 has 40 percent probability and 25 thousand dollar loss impact. Threat 3 has 10 percent probability and 100 thousand dollar loss impact.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.h{fill:#315b88}.cell{fill:#fff;stroke:#172033}.sum{fill:#fff2cc;stroke:#8a5300;stroke-width:2}</style><rect width="760" height="390" fill="#fff"/><text x="380" y="30" text-anchor="middle" font-size="21" font-weight="700">Independent threat exposure</text><g transform="translate(55 65)"><rect class="h" width="650" height="46"/><g fill="#fff" font-family="Arial" text-anchor="middle" font-weight="700"><text x="85" y="29">Threat</text><text x="230" y="29">Probability</text><text x="400" y="29">Impact</text><text x="565" y="29">EMV to calculate</text></g><g text-anchor="middle"><path class="cell" d="M0 46H650V96H0Z M0 96H650V146H0Z M0 146H650V196H0Z"/><path stroke="#172033" d="M170 46V196M300 46V196M500 46V196"/><text x="85" y="77">1</text><text x="230" y="77">20%</text><text x="400" y="77">$50k loss</text><text x="565" y="77">—</text><text x="85" y="127">2</text><text x="230" y="127">40%</text><text x="400" y="127">$25k loss</text><text x="565" y="127">—</text><text x="85" y="177">3</text><text x="230" y="177">10%</text><text x="400" y="177">$100k loss</text><text x="565" y="177">—</text><rect class="sum" y="215" width="650" height="58" rx="8"/><text x="325" y="251" font-size="18" font-weight="700">For each threat: probability × loss impact</text></g></g><text x="380" y="365" text-anchor="middle" font-size="14">Loss amounts shown as positive exposure magnitudes; all threats are independent.</text></svg>
