<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Cost and schedule status dashboard</title><desc id="desc">Planned value is 200 thousand dollars, earned value is 180 thousand, posted actual cost is 210 thousand, and an unposted 30 thousand dollar invoice for completed work was incurred before the status date.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.card{fill:#f7f9fc;stroke:#172033;stroke-width:2}.warn{fill:#fff2cc;stroke:#8a5300;stroke-width:3}.k{font-size:28px;font-weight:700}.l{font-size:15px}</style><rect width="760" height="400" fill="#fff"/><text x="380" y="32" text-anchor="middle" font-size="21" font-weight="700">Status-date performance dashboard</text><g text-anchor="middle"><rect class="card" x="40" y="70" width="200" height="100" rx="10"/><text class="l" x="140" y="103">Planned value (PV)</text><text class="k" x="140" y="143">$200k</text><rect class="card" x="280" y="70" width="200" height="100" rx="10"/><text class="l" x="380" y="103">Earned value (EV)</text><text class="k" x="380" y="143">$180k</text><rect class="card" x="520" y="70" width="200" height="100" rx="10"/><text class="l" x="620" y="103">Posted actual cost</text><text class="k" x="620" y="143">$210k</text><rect class="warn" x="100" y="205" width="260" height="120" rx="10"/><text class="l" x="230" y="238">Unposted invoice</text><text class="k" x="230" y="278">+$30k</text><text class="l" x="230" y="304">Incurred before status date</text><rect class="card" x="400" y="205" width="260" height="120" rx="10"/><text class="l" x="530" y="246">Status-date note</text><text x="530" y="278" font-size="16">Reconcile incurred cost</text><text class="l" x="530" y="304">before calculating performance</text></g><text x="380" y="370" text-anchor="middle" font-size="14">All monetary values are US dollars.</text></svg>
