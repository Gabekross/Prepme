<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="title desc"><title id="title">Simulated milestone confidence dates</title><desc id="desc">The milestone target is August 30. Simulation indicates P50 on August 24 and P80 on September 6. The target is between P50 and P80, so it has less than 80 percent confidence. A delay costs 120 thousand dollars per week, and sponsor tolerance requires at least 80 percent confidence.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.axis{stroke:#172033;stroke-width:3}.curve{stroke:#315b88;stroke-width:5;fill:none}.target{stroke:#9c2f2f;stroke-width:4;stroke-dasharray:8 5}.guide{stroke:#8a5300;stroke-width:2;stroke-dasharray:4 4}</style><rect width="820" height="400" fill="#fff"/><text x="410" y="30" text-anchor="middle" font-size="21" font-weight="700">Milestone completion confidence</text><path class="axis" d="M90 315H760M90 315V65"/><path class="curve" d="M115 300C230 292 285 250 350 190S500 95 705 75"/><path class="guide" d="M90 190H350V315M90 105H530V315"/><path class="target" d="M440 65V315"/><g font-size="14"><text x="65" y="320">0%</text><text x="55" y="195">50%</text><text x="55" y="110">80%</text><text x="350" y="340" text-anchor="middle">Aug 24 (P50)</text><text x="440" y="360" text-anchor="middle" fill="#9c2f2f">Aug 30 target</text><text x="530" y="340" text-anchor="middle">Sep 6 (P80)</text></g><text x="610" y="160" font-weight="700">Sponsor tolerance: ≥80%</text><text x="610" y="183">Delay impact: $120k/week</text><text x="410" y="385" text-anchor="middle" font-size="14">Completion date →</text></svg>
