<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Median stakeholder response time before and after the engagement change</title>
  <desc id="desc">Grouped bar chart. Operations improves from 5 to 2 days. Accessibility group worsens from 4 to 9 days. General community improves from 6 to 5 days. Each period is eight weeks with at least 30 responses per group.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.axis{stroke:#172033;stroke-width:2}.grid{stroke:#a8b0bd;stroke-dasharray:4 5}.before{fill:#315b88}.after{fill:#f2b134;stroke:#172033;stroke-width:2}.label{font-size:15px}.small{font-size:13px}</style>
  <rect width="760" height="430" fill="#fff"/><text x="380" y="28" text-anchor="middle" font-size="20" font-weight="700">Median response time (days)</text>
  <g class="grid"><path d="M70 345H730M70 285H730M70 225H730M70 165H730M70 105H730M70 45H730"/></g><path class="axis" d="M70 45V345H730"/>
  <g class="small" text-anchor="end"><text x="60" y="350">0</text><text x="60" y="290">2</text><text x="60" y="230">4</text><text x="60" y="170">6</text><text x="60" y="110">8</text><text x="60" y="50">10</text></g>
  <g><rect class="before" x="130" y="195" width="45" height="150"/><rect class="after" x="180" y="285" width="45" height="60"/><text x="152" y="188" text-anchor="middle">5</text><text x="202" y="278" text-anchor="middle">2</text><text x="178" y="370" text-anchor="middle" class="label">Operations</text>
  <rect class="before" x="345" y="225" width="45" height="120"/><rect class="after" x="395" y="75" width="45" height="270"/><text x="367" y="218" text-anchor="middle">4</text><text x="417" y="68" text-anchor="middle">9</text><text x="392" y="370" text-anchor="middle" class="label">Accessibility group</text>
  <rect class="before" x="575" y="165" width="45" height="180"/><rect class="after" x="625" y="195" width="45" height="150"/><text x="597" y="158" text-anchor="middle">6</text><text x="647" y="188" text-anchor="middle">5</text><text x="622" y="370" text-anchor="middle" class="label">General community</text></g>
  <g class="small"><rect class="before" x="220" y="397" width="20" height="14"/><text x="248" y="409">Before</text><rect class="after" x="340" y="397" width="20" height="14"/><text x="368" y="409">After</text><text x="470" y="409">8 weeks each; n ≥ 30/group/period</text></g>
</svg>
