<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">Schedule crashing options</title><desc id="desc">Activity X can be shortened by at most 5 days at 4 thousand dollars per day. Activity Y can be shortened by at most 8 days at 1 thousand dollars per day. Ten days must be recovered, with no new critical path or resource constraint.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.card{fill:#f7f9fc;stroke:#172033;stroke-width:2}.pick{fill:#fff2cc;stroke:#8a5300;stroke-width:3}</style><rect width="760" height="390" fill="#fff"/><text x="380" y="30" text-anchor="middle" font-size="21" font-weight="700">Crash options to recover 10 days</text><g text-anchor="middle"><rect class="card" x="70" y="70" width="270" height="110" rx="10"/><text x="205" y="103" font-size="20" font-weight="700">Activity X</text><text x="205" y="132">Maximum: 5 days</text><text x="205" y="158">Cost slope: $4k/day</text><rect class="card" x="420" y="70" width="270" height="110" rx="10"/><text x="555" y="103" font-size="20" font-weight="700">Activity Y</text><text x="555" y="132">Maximum: 8 days</text><text x="555" y="158">Cost slope: $1k/day</text><rect class="pick" x="140" y="220" width="480" height="95" rx="10"/><text x="380" y="256" font-size="17" font-weight="700">Required schedule recovery</text><text x="380" y="292" font-size="26" font-weight="700">10 days</text></g><text x="380" y="355" text-anchor="middle" font-size="14">Assumption: no new critical path and no resource constraint.</text></svg>
