<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Activity timing and total float</title><desc id="desc">The activity has early start day 5, early finish day 10, late start day 9, and late finish day 14. Its owner requests a 3-day delay.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.track{stroke:#172033;stroke-width:3}.early{fill:#315b88}.float{fill:#fff2cc;stroke:#8a5300;stroke-width:2}.request{stroke:#9c2f2f;stroke-width:4;stroke-dasharray:8 5}</style><rect width="760" height="360" fill="#fff"/><text x="380" y="30" text-anchor="middle" font-size="21" font-weight="700">Activity schedule window</text><path class="track" d="M70 285H710"/><g text-anchor="middle" font-size="13"><text x="70" y="310">Day 5</text><text x="230" y="310">Day 8</text><text x="283" y="310">Day 9</text><text x="337" y="310">Day 10</text><text x="497" y="310">Day 13</text><text x="550" y="310">Day 14</text></g><rect class="early" x="70" y="105" width="267" height="45"/><text x="203" y="134" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">Early window: ES 5 → EF 10</text><rect class="float" x="337" y="105" width="213" height="45"/><text x="443" y="134" text-anchor="middle">Scheduling flexibility</text><rect x="283" y="190" width="267" height="45" fill="#fff" stroke="#172033" stroke-width="3"/><text x="416" y="219" text-anchor="middle">Late window: LS 9 → LF 14</text><path class="request" d="M70 82H230"/><text x="150" y="66" text-anchor="middle" font-size="15">Requested delay: 3 days</text><text x="380" y="342" text-anchor="middle" font-size="14">Scale shows schedule days; bar width represents five days of activity duration.</text></svg>
