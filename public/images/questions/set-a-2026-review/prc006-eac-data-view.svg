<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Estimate at completion data view</title><desc id="desc">Budget at completion is 400 thousand dollars, earned value is 100 thousand, and actual cost is 120 thousand. The completed-work overrun was one-time, and remaining work is fixed-price at its original budget.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.box{fill:#f7f9fc;stroke:#172033;stroke-width:2}.note{fill:#fff2cc;stroke:#8a5300;stroke-width:2}</style><rect width="760" height="360" fill="#fff"/><text x="380" y="32" text-anchor="middle" font-size="21" font-weight="700">Forecast data at the status date</text><g text-anchor="middle"><rect class="box" x="55" y="75" width="190" height="85" rx="10"/><text x="150" y="106">Budget at completion</text><text x="150" y="140" font-size="27" font-weight="700">BAC $400k</text><rect class="box" x="285" y="75" width="190" height="85" rx="10"/><text x="380" y="106">Earned value</text><text x="380" y="140" font-size="27" font-weight="700">EV $100k</text><rect class="box" x="515" y="75" width="190" height="85" rx="10"/><text x="610" y="106">Actual cost</text><text x="610" y="140" font-size="27" font-weight="700">AC $120k</text><rect class="note" x="55" y="195" width="650" height="60" rx="10"/><text x="380" y="220" font-weight="700">Forecast assumption</text><text x="380" y="243">One-time overrun; remaining work is fixed-price and follows the original budget.</text><text x="380" y="302" font-size="18" font-weight="700">Select the forecast that matches the stated assumption.</text></g></svg>
