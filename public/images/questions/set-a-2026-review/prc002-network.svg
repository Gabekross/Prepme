<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">Activity-on-node project network</title><desc id="desc">Activity A, 3 days, branches to activity B, 7 days, and activity C, 2 days. Both B and C must finish before activity D, 4 days, can start. D leads to the end milestone.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#24324a"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172033}.node{fill:#fff;stroke:#24324a;stroke-width:3}.line{fill:none;stroke:#24324a;stroke-width:3;marker-end:url(#arrow)}</style><rect width="760" height="380" fill="#fff"/><text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700">Activity network</text><path class="line" d="M160 190 L245 120"/><path class="line" d="M160 190 L245 260"/><path class="line" d="M365 120 L465 190"/><path class="line" d="M365 260 L465 190"/><path class="line" d="M585 190 H665"/><g text-anchor="middle"><rect class="node" x="60" y="150" width="100" height="80" rx="12"/><text x="110" y="184" font-size="21" font-weight="700">A</text><text x="110" y="210" font-size="17">3 days</text><rect class="node" x="245" y="80" width="120" height="80" rx="12"/><text x="305" y="114" font-size="21" font-weight="700">B</text><text x="305" y="140" font-size="17">7 days</text><rect class="node" x="245" y="220" width="120" height="80" rx="12"/><text x="305" y="254" font-size="21" font-weight="700">C</text><text x="305" y="280" font-size="17">2 days</text><rect class="node" x="465" y="150" width="120" height="80" rx="12"/><text x="525" y="184" font-size="21" font-weight="700">D</text><text x="525" y="210" font-size="17">4 days</text><rect class="node" x="665" y="160" width="70" height="60" rx="12"/><text x="700" y="197" font-size="17" font-weight="700">End</text></g><text x="380" y="348" text-anchor="middle" font-size="16">Finish-to-start relationships; both branches must finish before D starts.</text></svg>
