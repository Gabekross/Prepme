<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Variance at completion forecast card</title><desc id="desc">Budget at completion is 600 thousand dollars and estimate at completion is 720 thousand. Governance requires escalation when forecast overrun exceeds 15 percent of budget at completion.</desc><style>text{font-family:Arial,sans-serif;fill:#172033}.card{fill:#f7f9fc;stroke:#172033;stroke-width:2}.alert{fill:#fff2cc;stroke:#8a5300;stroke-width:3}</style><rect width="760" height="360" fill="#fff"/><text x="380" y="31" text-anchor="middle" font-size="21" font-weight="700">Forecast at completion</text><g text-anchor="middle"><rect class="card" x="55" y="70" width="200" height="90" rx="10"/><text x="155" y="100">BAC</text><text x="155" y="138" font-size="28" font-weight="700">$600k</text><rect class="card" x="280" y="70" width="200" height="90" rx="10"/><text x="380" y="100">EAC</text><text x="380" y="138" font-size="28" font-weight="700">$720k</text><rect class="card" x="505" y="70" width="200" height="90" rx="10"/><text x="605" y="100">Calculate</text><text x="605" y="138" font-size="23" font-weight="700">VAC = BAC − EAC</text><rect class="alert" x="145" y="205" width="470" height="85" rx="10"/><text x="380" y="239" font-weight="700">Governance threshold</text><text x="380" y="267">Escalate when forecast overrun is greater than 15% of BAC</text></g><text x="380" y="330" text-anchor="middle" font-size="14">All monetary values are US dollars.</text></svg>
